<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Embaixadores da Esperança</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Identidade visual copiada do app dos Pequenos Grupos (index.html) — mesmas variáveis,
   mesmos componentes (.content-card, .body-text, .opt-btn, .start-btn, .phase-tag).
   Só o necessário para esta experiência foi trazido. */
:root {
  --navy: #0D2137;
  --navy2: #1A3A56;
  --blue: #1E5F8C;
  --blue-mid: #2E7BB5;
  --blue-light: #D6EAF8;
  --blue-pale: #EBF5FB;
  --gold: #B8860B;
  --gold-mid: #D4A017;
  --teal: #0E7B6C;
  --teal-light: #D5EDE9;
  --purple: #5C3D8F;
  --coral: #C0392B;
  --coral-light: #FDECEA;
  --text: #0D0D1A;
  --text2: #20293A;
  --text3: #4A5868;
  --border: rgba(0,0,0,0.09);
  --bg: #F7F5F0;
  --card: #FFFFFF;
  --radius: 14px;
  --radius-sm: 9px;
  --ff-body: 'Source Sans 3', sans-serif;
  --ff-serif: 'Lora', serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--ff-body);background:var(--bg);color:var(--text);min-height:100vh}
#app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:24px}

.phase-dots{display:flex;gap:5px;align-items:center;justify-content:center;padding:.9rem 0 .2rem}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .25s}
.pdot.done{background:var(--teal)}
.pdot.active{background:var(--blue-mid);width:22px;border-radius:3px}

@keyframes embAgoIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.emb-ago-in{animation:embAgoIn .5s ease both}
.emb-ago-btn:disabled{background:var(--border);color:var(--text3);cursor:default}
@media (prefers-reduced-motion:reduce){.emb-ago-in{animation:none}}

.phase-tag{font-size:14px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:.4rem;font-family:var(--ff-body)}
.tag-question{color:var(--purple)}.tag-content{color:var(--blue)}.tag-apply{color:var(--gold)}
.tag-insight{color:var(--coral)}.tag-decision{color:var(--navy2)}.tag-close{color:var(--teal)}
.content-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);padding:1.15rem 1rem}
.body-text{font-size:21px;line-height:1.7;color:var(--text);font-family:var(--ff-body)}
.body-text strong{font-weight:600;color:var(--navy)}
.opt-btn{width:100%;background:var(--bg);border:0.5px solid rgba(0,0,0,0.13);border-radius:var(--radius-sm);padding:.75rem .9rem;text-align:left;font-size:20px;color:var(--text);cursor:pointer;transition:all .15s;line-height:1.45;font-family:var(--ff-body)}
.opt-btn:hover:not(:disabled){background:var(--blue-pale);border-color:var(--blue-light);color:var(--navy)}
.opt-btn.chosen{background:var(--teal-light);border-color:var(--teal);color:#04342C}
.start-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);padding:.75rem;font-size:20px;font-weight:500;cursor:pointer;font-family:var(--ff-body);transition:background .15s;letter-spacing:.2px}
.start-btn:hover:not(:disabled){background:var(--navy2)}

.campo{width:100%;background:var(--card);border:0.5px solid rgba(0,0,0,0.16);border-radius:var(--radius-sm);padding:.7rem .8rem;font-size:19px;color:var(--text);font-family:var(--ff-body)}
.campo:focus{outline:none;border-color:var(--blue-mid)}
.rotulo-campo{display:block;font-size:15px;font-weight:600;color:var(--text3);margin-bottom:.35rem;font-family:var(--ff-body)}
.faixa-teste{background:#4A1B0C;color:#F5C4B3;font-size:13px;text-align:center;padding:6px 10px;font-family:var(--ff-body)}
.aviso-erro{background:var(--coral-light);border:0.5px solid #F3B8B4;border-radius:var(--radius-sm);padding:.7rem .8rem;font-size:15px;color:#8A2B20;line-height:1.45;font-family:var(--ff-body)}
</style>
</head>
<body>
<div id="app"><div id="tela"></div></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// EMBAIXADORES DA ESPERANÇA · versão para colaboradores SEM Pequeno Grupo
//
// App independente do index.html (app dos Pequenos Grupos). Roda no mesmo endereço,
// então compartilha o localStorage do navegador — por isso TODA chave daqui usa o
// prefixo "embx_" e este arquivo NUNCA lê nem escreve chaves "jdpg_*" nem o cookie
// "amj3" do outro app.
//
// GRAVAÇÃO: cria um documento próprio na coleção "embaixadoresExternos". NÃO toca no
// documento jdpg/grupos, que guarda os 50 Pequenos Grupos. Um documento por pessoa,
// criado com POST — não existe leitura nem reescrita, então duas pessoas registrando
// ao mesmo tempo nunca se sobrescrevem.
// ══════════════════════════════════════════════════════════════════════════════

const FB = {
  projectId: 'jornada-pequenos-grupos',
  apiKey: 'AIzaSyDPuoP221leqvON_d-K3auyANOoH7eal9U',
  colecao: 'embaixadoresExternos'
};

// Modo de teste isolado, mesmo padrão do app dos PGs (Etapa 0): com ?teste=1 na URL,
// nada é enviado para a nuvem — a tela se comporta igual, mas a gravação é simulada.
const MODO_TESTE = (function () {
  try {
    const ativo = new URLSearchParams(location.search).get('teste') === '1'
      || sessionStorage.getItem('embx_modo_teste') === '1';
    if (ativo) sessionStorage.setItem('embx_modo_teste', '1');
    return ativo;
  } catch (_) { return false; }
})();

const CHAVE_ESCOLHAS = 'embx_ago_escolhas_v1';
const CHAVE_REGISTRO = 'embx_ago_registro_v1';

function mesAtual() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
// O selo do período usa este cálculo (mesmo princípio do embMonthLabel do app dos PGs) em vez
// de um mês fixo no texto — o selo "AGOSTO" ficou preso mesmo depois que setembro começou,
// porque a tela de acolhimento e a porta de entrada tinham o mês escrito à mão.
function mesLabel(mk) {
  const [y, m] = mk.split('-');
  return MESES_PT[parseInt(m, 10) - 1] + '/' + y;
}
document.title = 'Embaixadores da Esperança — ' + mesLabel(mesAtual());
function sanitize(s) {
  return String(s == null ? '' : s).replace(/[<>&"]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c]));
}
function carregar(chave) {
  try { const s = localStorage.getItem(chave); return s ? JSON.parse(s) : null; } catch (_) { return null; }
}
function guardar(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (_) {}
}

// Escolhas da pessoa (dificuldade, dimensão, força). Só neste aparelho, nunca na nuvem —
// o que vai para a nuvem é apenas nome + setor, na tela final.
let ESCOLHAS = carregar(CHAVE_ESCOLHAS) || {};
if (ESCOLHAS.monthKey !== mesAtual()) ESCOLHAS = { monthKey: mesAtual() };
function salvarEscolhas() { guardar(CHAVE_ESCOLHAS, ESCOLHAS); }

let ETAPA = 0;   // 0 = acolhimento · 1..8 = telas da jornada (diferença, ponte, espelho,
                 // entrega, força, missão, desafio, participação)

// PORTA DE ENTRADA — este app é só para quem NÃO participa de Pequeno Grupo. Quem já está
// em um PG precisa registrar pelo app da Jornada, senão a participação não conta para o
// grupo dele. A pergunta vem ANTES do acolhimento, para ninguém fazer as 7 telas à toa.
//
// É uma pergunta de honra, não uma trava técnica: não há login, então quem responder "sim"
// pode recarregar e responder outra coisa. Resolve o erro por desinformação, que é o caso real.
// De propósito NÃO fica guardada no localStorage — um toque errado não pode virar bloqueio
// permanente, e reperguntar a cada visita não custa nada.
let TEM_PG = null;   // null = ainda não respondeu · true = já está em PG · false = pode seguir

// ── SETORES ───────────────────────────────────────────────────────────────────
// Lista construída a partir do mapeamento institucional de 13/08/2026. Quem não se
// encontrar aqui usa "Outro setor" e escreve o nome.
const SETORES = [
  'Almoxarifado','Auditoria','Autorização','Capelania','CC','CC HAI','CMAB',
  'Contabilidade','Contas a Receber','CTI Clínico','Equipe Multi','Farmácia',
  'Faturamento','Faturamento - HAI','HAI','Higienização','Higienização HAI',
  'Hotelaria','Imagem','Laboratório','Laboratório HAI','Manutenção',
  'Marketing/Ouvidoria','Médicos','Nutrição','OPME','Recepção','RH - DP - Jurídico',
  'Segurança','Serviço Social','TI'
];

// ── TELAS ─────────────────────────────────────────────────────────────────────
function dotsHtml() {
  if (ETAPA < 1 || ETAPA > 8) return '';
  return '<div class="phase-dots">' + [1,2,3,4,5,6,7,8].map(n =>
    `<span class="pdot ${n < ETAPA ? 'done' : n === ETAPA ? 'active' : ''}"></span>`).join('') + '</div>';
}
function botaoHtml(rotulo, atraso) {
  return `<button class="start-btn emb-ago-in" style="letter-spacing:1.5px;font-weight:700;animation-delay:${atraso}s" onclick="avancar()">${rotulo}</button>`;
}

// PORTA 1 — A PERGUNTA. Os dois botões têm o mesmo peso visual de propósito: destacar um
// deles induziria a resposta, e o que se quer aqui é a resposta verdadeira.
function portaHtml() {
  const selo = mesLabel(mesAtual()).split('/')[0].toUpperCase();
  return `
    <div style="background:linear-gradient(160deg,var(--navy),var(--navy2));padding:2rem 1.25rem 1.75rem;text-align:center">
      <div style="font-size:44px;line-height:1;margin-bottom:.6rem">🌟</div>
      <div style="display:inline-block;font-size:12px;font-weight:700;letter-spacing:2.5px;color:var(--gold-mid);border:1px solid rgba(212,160,23,.45);border-radius:99px;padding:3px 12px;margin-bottom:.7rem">${selo}</div>
      <div style="font-family:var(--ff-serif);font-size:30px;font-weight:500;color:#fff;line-height:1.25">Embaixadores da Esperança</div>
    </div>
    <div style="padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1rem">
      <div class="content-card">
        <div class="phase-tag tag-close">Antes de começar</div>
        <p class="body-text" style="margin:0 0 .9rem">Esta experiência é para os colaboradores do Silvestre que <strong>ainda não participam</strong> de um Pequeno Grupo.</p>
        <p class="body-text" style="margin:0"><strong>Você já faz parte de um Pequeno Grupo do Silvestre?</strong></p>
      </div>
      <button class="start-btn" style="background:var(--card);color:var(--blue);border:0.5px solid var(--border)" onclick="responderTemPg(true)">SIM, JÁ PARTICIPO</button>
      <button class="start-btn" style="background:var(--card);color:var(--blue);border:0.5px solid var(--border)" onclick="responderTemPg(false)">NÃO PARTICIPO</button>
    </div>`;
}

// PORTA 2 — O AVISO para quem já está em PG. Por decisão do usuário (19/08) NÃO há link nem
// redirecionamento: a pessoa abre o app dos PGs por conta própria, pelo caminho que ela já usa.
function avisoTemPgHtml() {
  return `
    <div style="background:linear-gradient(160deg,var(--navy),var(--navy2));padding:2rem 1.25rem 1.75rem;text-align:center">
      <div style="font-size:44px;line-height:1;margin-bottom:.6rem">🌟</div>
      <div style="font-family:var(--ff-serif);font-size:26px;font-weight:500;color:#fff;line-height:1.3">O seu lugar é no seu<br>Pequeno Grupo</div>
    </div>
    <div style="padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1rem">
      <div class="content-card" style="border-left:3px solid var(--teal)">
        <p class="body-text" style="margin:0 0 .9rem">Que bom que você já faz parte de um Pequeno Grupo do Silvestre!</p>
        <p class="body-text" style="margin:0 0 .9rem">Esta versão do Embaixadores da Esperança é só para quem ainda não está em nenhum grupo. <strong>A sua está no app da Jornada Discipular em Pequenos Grupos</strong> — o mesmo que você já usa com o seu grupo.</p>
        <p class="body-text" style="margin:0">É importante que seja por lá: assim a sua participação é somada ao seu Pequeno Grupo. Se você registrar por aqui, ela não aparece no seu grupo.</p>
      </div>
      <div class="content-card">
        <div class="phase-tag tag-apply">Como fazer</div>
        <p class="body-text" style="margin:0">Abra o app da Jornada em Pequenos Grupos, do jeito que você já entra nele, e toque no cartão <strong>🌟 Embaixadores da Esperança</strong> na sua tela de missões.</p>
      </div>
      <button class="start-btn" style="background:transparent;color:var(--text3);border:none;font-size:15px" onclick="responderTemPg(null)">Respondi por engano</button>
    </div>`;
}

function aberturaHtml() {
  const selo = mesLabel(mesAtual()).split('/')[0].toUpperCase();
  return `
    <div style="background:linear-gradient(160deg,var(--navy),var(--navy2));padding:2rem 1.25rem 1.75rem;text-align:center">
      <div style="font-size:44px;line-height:1;margin-bottom:.6rem">🌟</div>
      <div style="display:inline-block;font-size:12px;font-weight:700;letter-spacing:2.5px;color:var(--gold-mid);border:1px solid rgba(212,160,23,.45);border-radius:99px;padding:3px 12px;margin-bottom:.7rem">${selo}</div>
      <div style="font-family:var(--ff-serif);font-size:30px;font-weight:500;color:#fff;line-height:1.25">Embaixadores da Esperança</div>
      <div style="font-family:var(--ff-serif);font-style:italic;font-size:20px;color:var(--gold-mid);margin-top:.55rem">Construindo pontes</div>
    </div>
    <div style="padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1rem">
      <div class="content-card">
        <p class="body-text" style="margin:0 0 .9rem"><strong>Você não precisa mudar o mundo inteiro.</strong></p>
        <p class="body-text" style="margin:0 0 .9rem">Às vezes, a esperança começa quando duas pessoas que pensam diferente conseguem permanecer na mesma conversa.</p>
        <p class="body-text" style="margin:0">Começa quando você escolhe ouvir em vez de atacar. Quando decide compreender antes de julgar. Quando enxerga alguém que todos ignoraram.</p>
      </div>
      <div class="content-card" style="border-left:3px solid var(--teal)">
        <p class="body-text" style="margin:0"><strong>A próxima ponte pode começar com você.</strong></p>
      </div>
      <button class="start-btn" style="letter-spacing:1.5px;font-weight:700" onclick="avancar()">COMEÇAR A JORNADA</button>
    </div>`;
}

// TELA 1 — A DIFERENÇA. Texto de setembro/2026 ("Construindo pontes").
function tela1Html() {
  const diferencas = ['Pensamos diferente.','Acreditamos diferente.','Temos histórias diferentes.','Viemos de lugares diferentes.','Pertencemos a grupos diferentes.'];
  const linhas = diferencas.map((d, i) =>
    `<div class="emb-ago-in" style="animation-delay:${(0.35 + i * 0.22).toFixed(2)}s;font-size:19px;line-height:1.6;color:var(--text2)">${d}</div>`).join('');
  const atrasoLados = 0.35 + diferencas.length * 0.22 + 0.25;
  const atrasoCard2 = atrasoLados + 0.8;
  const atrasoCard3 = atrasoCard2 + 0.4;
  return `
    ${dotsHtml()}
    <div style="padding:.5rem 1rem 1.5rem;display:flex;flex-direction:column;gap:1rem">
      <div class="content-card">
        <div class="phase-tag tag-content">A diferença</div>
        <p class="body-text emb-ago-in" style="margin:0 0 1rem">Vivemos cercados por diferenças.</p>
        <div style="display:flex;flex-direction:column;gap:.35rem;padding-left:.85rem;border-left:3px solid var(--blue-light)">${linhas}</div>
        <p class="body-text emb-ago-in" style="margin:1.1rem 0 0;animation-delay:${atrasoLados.toFixed(2)}s">E quanto mais diferentes nos sentimos, mais facilmente criamos dois lados: <strong>"Nós" e "eles".</strong></p>
      </div>
      <div class="content-card emb-ago-in" style="animation-delay:${atrasoCard2.toFixed(2)}s">
        <p class="body-text" style="margin:0 0 .8rem">Mas existe algo que não podemos esquecer: antes de pertencer a qualquer grupo, cada pessoa é uma pessoa.</p>
        <p class="body-text" style="margin:0"><strong>Tem uma história. Tem medos. Tem sonhos. Tem feridas que talvez ninguém conheça.</strong></p>
      </div>
      <div class="content-card emb-ago-in" style="animation-delay:${atrasoCard3.toFixed(2)}s;border-left:3px solid var(--teal)">
        <p class="body-text" style="margin:0">A diferença não precisa desaparecer para que exista respeito. <strong>Podemos discordar sem desumanizar.</strong></p>
      </div>
      ${botaoHtml('CONTINUAR', (atrasoCard3 + 0.4).toFixed(2))}
    </div>`;
}

// TELA 2 — A PONTE. Substitui a antiga "O problema" (rótulos revelados em 3 etapas via SUB,
// removido — esta tela não precisa de revelação em partes).
function tela2Html() {
  const trocas = [
    { antes: '"Eu sei como ele é."',        depois: '"O que eu ainda não sei sobre ele?"' },
    { antes: '"Ela está errada."',           depois: '"O que posso compreender antes de responder?"' },
    { antes: '"Ele é diferente de mim."',    depois: '"Mesmo diferente de mim, ele continua tendo valor."' },
  ];
  const cartoesTroca = trocas.map((t, i) => `
      <div class="content-card emb-ago-in" style="animation-delay:${(0.9 + i * 0.3).toFixed(2)}s">
        <p class="body-text" style="margin:0 0 .3rem;color:var(--text3)">${t.antes}</p>
        <p class="body-text" style="margin:0">por: <strong>${t.depois}</strong></p>
      </div>`).join('');
  return `
    ${dotsHtml()}
    <div style="padding:.5rem 1rem 1.5rem;display:flex;flex-direction:column;gap:1rem">
      <div class="content-card">
        <div class="phase-tag tag-insight">A ponte</div>
        <p class="body-text emb-ago-in" style="margin:0 0 .8rem">Na jornada anterior, você descobriu como os rótulos podem nos impedir de enxergar pessoas.</p>
        <p class="body-text emb-ago-in" style="margin:0 0 .8rem;animation-delay:.4s">Mas existe um passo além. Não basta apenas evitar julgar.</p>
        <p class="body-text emb-ago-in" style="margin:0;animation-delay:.7s"><strong>Precisamos aprender a construir pontes.</strong></p>
      </div>
      <div style="display:flex;flex-direction:column;gap:.45rem">${cartoesTroca}</div>
      <div class="content-card emb-ago-in" style="animation-delay:2.1s;border-left:3px solid var(--teal)">
        <p class="body-text" style="margin:0">Construir pontes não significa concordar com tudo. <strong>Significa escolher compreender antes de rejeitar.</strong></p>
      </div>
      ${botaoHtml('E VOCÊ?', '2.5')}
    </div>`;
}

// TELA 3 — O ESPELHO. Texto de setembro/2026 reformulado ("pontos cegos" em vez de
// "rótulos"); mecânica de escolha única igual, agora com 9 alternativas.
function tela3Html() {
  const e = ESCOLHAS.dificuldade;
  const opcoes = ESPELHO.map((o, i) => `
        <button class="opt-btn${e && e.id === o.id ? ' chosen' : ''} emb-ago-in" data-opcao="${o.id}"
                style="animation-delay:${(1.55 + i * 0.06).toFixed(2)}s" onclick="escolherEspelho('${o.id}')">${o.texto}</button>`).join('');
  return `
    ${dotsHtml()}
    <div style="padding:.5rem 1rem 1.5rem;display:flex;flex-direction:column;gap:1rem">
      <div class="content-card">
        <div class="phase-tag tag-decision">O espelho</div>
        <p class="body-text emb-ago-in" style="margin:0 0 .8rem">Talvez você não se considere uma pessoa preconceituosa. <strong>Mas todos nós temos pontos cegos.</strong></p>
        <div class="emb-ago-in" style="animation-delay:.5s;display:flex;flex-direction:column;gap:.35rem;padding-left:.85rem;border-left:3px solid var(--blue-light);font-size:16px;line-height:1.55;color:var(--text2)">
          <div>Às vezes ouvimos apenas para responder.</div>
          <div>Às vezes precisamos estar certos.</div>
          <div>Às vezes conversamos somente com quem concorda conosco.</div>
          <div>Às vezes somos rápidos para exigir compreensão e lentos para oferecer compreensão.</div>
        </div>
      </div>
      <div class="content-card emb-ago-in" style="animation-delay:1.4s">
        <p class="body-text" style="margin:0 0 .85rem">Quando encontro alguém muito diferente de mim, qual é meu maior desafio?</p>
        <div id="espelho-opcoes" style="display:flex;flex-direction:column;gap:.45rem">${opcoes}</div>
      </div>
      <div id="espelho-dica" style="${e ? 'display:none;' : ''}text-align:center;font-size:14px;color:var(--text3)">Escolha uma opção para continuar.</div>
      <button id="espelho-continuar" class="start-btn emb-ago-btn" style="letter-spacing:1.5px;font-weight:700" ${e ? '' : 'disabled'} onclick="avancar()">CONTINUAR</button>
    </div>`;
}

// Alternativas do espelho (usadas pela tela 3, acima).
const ESPELHO = [
  { id:'ouvir_preparar', texto:'Ouvir sem preparar minha resposta' },
  { id:'admitir_erro',   texto:'Admitir que posso estar errado' },
  { id:'respeitar',      texto:'Respeitar alguém de quem discordo' },
  { id:'empatia',        texto:'Ter empatia por alguém de quem não gosto' },
  { id:'reacoes',        texto:'Controlar minhas reações' },

// Envia UM documento novo para a coleção "embaixadoresExternos". Não lê nem reescreve
// nada — por isso registros simultâneos nunca se atropelam.
async function registrarParticipacao() {
  const nome = (document.getElementById('campo-nome') || {}).value || '';
  const sel = (document.getElementById('campo-setor') || {}).value || '';
  const outro = (document.getElementById('campo-setor-outro') || {}).value || '';
  const setor = sel === '__outro__' ? outro.trim() : sel.trim();
  const erroEl = document.getElementById('registro-erro');
  if (erroEl) erroEl.style.display = 'none';

  if (nome.trim().length < 3) return mostrarErro('Escreva seu nome para registrar a participação.');
  if (!setor) return mostrarErro('Selecione (ou escreva) o setor onde você trabalha.');

  const btn = document.getElementById('btn-registrar');
  if (btn) { btn.disabled = true; btn.textContent = 'Registrando…'; }

  const agora = new Date();
  const corpo = {
    fields: {
      nome:     { stringValue: nome.trim() },
      setor:    { stringValue: setor },
      monthKey: { stringValue: mesAtual() },
      criadoEm: { stringValue: agora.toISOString() }
    }
  };

  try {
    if (MODO_TESTE) {
      console.log('[MODO TESTE] gravação simulada, nada foi enviado:', corpo);
    } else {
      const url = `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/${FB.colecao}?key=${FB.apiKey}`;
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
      });
      if (!resp.ok) {
        let detalhe = 'HTTP ' + resp.status;
        try { const j = await resp.json(); if (j && j.error && j.error.message) detalhe = j.error.message; } catch (_) {}
        throw new Error(detalhe);
      }
    }
    guardar(CHAVE_REGISTRO, {
      nome: nome.trim(), setor, monthKey: mesAtual(),
      data: agora.toLocaleDateString('pt-BR'), teste: MODO_TESTE || undefined
    });
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '✅ REGISTRAR MINHA PARTICIPAÇÃO'; }
    mostrarErro('Não foi possível registrar agora. Verifique sua conexão e tente novamente.', e && e.message);
  }
}

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────────────────
function avancar() {
  if (ETAPA < 8) { ETAPA++; render(); window.scrollTo(0, 0); }
}
function reverExperiencia() { ETAPA = 0; render(); window.scrollTo(0, 0); }
function responderTemPg(temPg) { TEM_PG = temPg; render(); window.scrollTo(0, 0); }

function render() {
  const telas = [aberturaHtml, tela1Html, tela2Html, tela3Html, tela4Html, tela5Html, tela6Html, tela7Html, tela8Html];
  const faixa = MODO_TESTE ? '<div class="faixa-teste">MODO DE TESTE · nada é gravado na nuvem</div>' : '';
  const conteudo = TEM_PG === null ? portaHtml()
                 : TEM_PG === true ? avisoTemPgHtml()
                 : telas[ETAPA]();
  document.getElementById('tela').innerHTML = faixa + conteudo;
}

// Quem já registrou neste mês cai direto na tela de confirmação, em vez de refazer tudo.
(function iniciar() {
  const registro = carregar(CHAVE_REGISTRO);
  // Quem já registrou obviamente já respondeu a porta — repetir a pergunta deixaria a tela
  // de confirmação inalcançável.
  if (registro && registro.monthKey === mesAtual()) { TEM_PG = false; ETAPA = 8; }
  render();
})();
</script>
